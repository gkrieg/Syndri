[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syndri-recomb-reproduction"
version = "0.1.0"
description = "Self-contained Syndri reproduction for RECOMB paper 395"
requires-python = ">=3.10"
dependencies = [
  "torch==2.8.0", "accelerate==1.1.0", "anndata==0.11.0rc3",
  "numpy==1.26.4", "pandas==2.2.2", "scipy==1.13.1",
  "scanpy==1.10.1", "scikit-learn==1.5.0", "scib-metrics==0.5.6",
  "harmonypy==0.0.10", "hydra-core==1.3.2", "omegaconf==2.3.0",
  "torchmetrics==1.4.0.post0", "transformers==4.41.2", "einops==0.8.0",
  "mygene==3.2.2", "awkward>=2.6,<3", "wandb==0.17.0", "psutil",
  "matplotlib>=3.8", "seaborn==0.13.2", "h5py>=3.10", "tqdm", "requests",
  "pyyaml", "pyarrow", "shapely>=2", "openpyxl", "leidenalg==0.10.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["syndri_repro*", "Heimdall*"]

