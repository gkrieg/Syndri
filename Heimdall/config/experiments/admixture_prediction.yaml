# @package _global_

###
# Set the experiment parts you would like to import
####

defaults:
  - override /model: transformer_syndri_medium #transformer # the chosen model
  - override /dataset: chromium_breast_GSM95019174_augmented # dataset for the relevant task
  - override /tasks: admixture_correction # dataset for the relevant task
  - override /scheduler: cosine # contains scheduler
  - override /trainer: default # contains optimizer and trainer details
  - override /optimizer: AdamW
  - override /fc: admixture_test
  - override /fg: identity
  - override /fe: identity
  - override /loss: MaskedBCEWithLogitsLoss

####
# Set the specific parameters you would like to change from the defaults
####


    #project_name: polygenic_disease_risk  # project name for WandB
    #run_name: ${fg.type}_${fe.type}_${fc.type}_${model.type}_lr${optimizer.args.lr}_bz${tasks.args.batchsize}  ## what is set for WandB
    #work_dir: work_dir  # set your custom working directory


seed: 54

# run_name: ${fg.type}_${fe.type}_${fc.type}_${model.type}_lr${optimizer.args.lr}_bz${tasks.args.batchsize}  ## what is set for WandB
# work_dir: '${project_name}_results/${fg.type}_${fe.name}_${fc.type}_${dataset.dataset_name}_lr${optimizer.args.lr}_bz${tasks.args.batchsize}_seed${seed}_ag${fe.args.drop_zeros}'  ## set your custom working directory

run_name: chromium_breast_GSM95019174_augmented_mlp ## what is set for WandB
work_dir: '${project_name}_results/chromium_breast_GSM95019174_augmented_mlp'  ## set your custom working directory


project_name: 'admixture_prediction' #project name for WandB
dataset:
  preprocess_args:
    fix_admixture: false

tasks:
  args:
    splits:
      col: split

loss:
  args:
    pos_weight: 4.0



trainer:
 accumulate_grad_batches: 5

optimizer:
  args: 
    lr: 2e-3
    # warmup_ratio: 0.1
 
