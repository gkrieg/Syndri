dataset_name: "10x_nsclc-cosmx_Lung9-Rep1"

preprocess_args:
  data_path: "/compute/oven-0-13/jwinchel/scRNA-seq/adata/10x_nsclc-cosmx_Lung9-Rep1.h5ad"
  top_n_genes: false
  normalize: false
  log_1p: false
  scale_data: false
  truncate_counts_max_value: null
  admixture: true
  fix_admixture: false
  admix_layer: "admixed_0"
  binary_layer: "is_transcript_added_0"
  species: "human"

  admixture_args:
    k_neighbors: 5
    min_sampled_transcript_threshold: 10
    min_source_transcript_count: 10
    use_same_cell_type_neighbors: False
    only_sample_unexpressed_genes: True
    mask_out_random_genes: False
    mask_out_frac: 0.0
    tau_range: [0.7,0.85]
    n_repeats: 1
    coord_cols: ["CenterX_global_px", "CenterY_global_px"]
    tissue_col: "batch"
