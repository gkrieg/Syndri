dataset_name: "admixture_nsclc_inference"

preprocess_args:
  # data_path: "/compute/oven-0-13/jwinchel/processed_adata/NSCLC_ST_withneighbors.h5ad"
  # data_path: "/work/magroup/skrieger/Syndri/data/processed_adata/NSCLC_ST_labeltransfer_consolidated_formatted.h5ad"
  data_path: '/compute/oven-0-13/jwinchel/spatial_adata/cosmx_nsclc_Lung5-Rep1_adata_annotated.h5ad'
  top_n_genes: false
  normalize: false
  log_1p: false
  scale_data: false
  truncate_counts_max_value: null
  admixture: true
  apply_admixture: false
  admix_layer: "admixed"
  binary_layer: "is_transcript_added"
  species: "human"

  admixture_args:
    coord_cols: ["CenterX_global_px", "CenterY_global_px"]
    tissue_col: null
    k_neighbors: 3
    frac_transcript_per_cell: 0.05
    min_sampled_transcript_threshold: 0
    min_source_transcript_count: 400
    use_same_cell_type_neighbors: False
    only_sample_unexpressed_genes: True
    mask_out_random_genes: False
    mask_out_frac: 0.0
    tau_range: [0.0, 0.15]
    n_repeats: 1
