args:
  task_type: admixture_binary
  context_length: 509
  label_obsm_name: is_transcript_added_0
  splits:
    type: predefined
    keys_:
      train: train
      val: val
      test: val
  metrics:
    - F1Score
    - Precision
    - Recall
    - Accuracy
    - ConfusionMatrix
  track_metric: F1Score
  # train_split: 0.8
  # prediction_dim: 14
  shuffle: true
  batchsize: 32
  epochs: 50
  dataset_config:
    type: Heimdall.datasets.AdmixtureInstanceDataset
  head_config:
    type: Heimdall.models.LinearCellPredHead
