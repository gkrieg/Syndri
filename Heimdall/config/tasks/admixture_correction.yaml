args:
  task_type: admixture_binary
  context_length: null
  label_obsm_name: is_transcript_added_0
  splits:
    type: predefined
    keys_:
      train: train
      val: val
      test: val
  metrics:
    - F1Score
    - Precision
    - Recall
    - Accuracy
    - ConfusionMatrix
  silhouette_delta:
    enabled: false
    split: train
    label_col_name: cell_type
    prediction_threshold: 0.5
    n_pcs: 50
    normalize_total: 10000
    log1p: true
    metric: cosine
    max_cells: 5000
    random_state: 0
  external_eval:
    enabled: false
    data_path: null
    dataset_name: null
    split: full
    prefix: external_eval
    every_n_epochs: 1
    fixed_epoch: null
    require_matching_var_names: true
    run_model_metrics: true
    metrics_eval:
      enabled: false
      script_path: null
      probability_layer: _training_syndri_probs
      output_dir: null
      write_outputs: true
      tissue: null
      sample_replicate: null
      args: {}
    overrides: {}
  track_metric: F1Score
  # train_split: 0.8
  # prediction_dim: 14
  admixture_pred_head_type: Heimdall.models.AdmixtureGeneTokenPredHead
  # Alternative: Heimdall.models.LinearCellPredHead
  shuffle: true
  batchsize: 32
  epochs: 1000
  dataset_config:
    type: Heimdall.datasets.AdmixtureInstanceDataset
  head_config:
    type: ${tasks.args.admixture_pred_head_type}
    args:
      num_prefix_tokens: null
